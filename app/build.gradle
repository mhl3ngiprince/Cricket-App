plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.finedine.spucricketclub'
    compileSdk 34

    defaultConfig {
        applicationId "com.finedine.spucricketclub"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {


    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.annotation:annotation:1.7.0'

    // Camera dependencies
    implementation 'androidx.camera:camera-core:1.3.0'
    implementation 'androidx.camera:camera-camera2:1.3.0'
    implementation 'androidx.camera:camera-lifecycle:1.3.0'
    implementation 'androidx.camera:camera-video:1.3.0'
    implementation 'androidx.camera:camera-view:1.3.0'
    implementation 'androidx.camera:camera-extensions:1.3.0'

    // ML Kit for face recognition
    implementation 'com.google.mlkit:face-detection:16.1.5'
    // implementation 'com.google.mlkit:text-recognition:16.0.0'

    // ML Kit for pose detection - temporarily disabled to reduce build size
    // implementation 'com.google.mlkit:pose-detection:18.0.0-beta3'
    // implementation 'com.google.mlkit:pose-detection-accurate:18.0.0-beta3'

    // ML Kit for object detection - temporarily disabled to reduce build size
    // implementation 'com.google.mlkit:object-detection:17.0.0'
    // implementation 'com.google.mlkit:object-detection-custom:17.0.0'
    // implementation 'com.google.mlkit:image-labeling:17.0.7'
    // implementation 'com.google.mlkit:image-labeling-custom:17.0.1'

    // ML Kit for segmentation - temporarily disabled to reduce build size
    // implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta4'

    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.8.0')
    implementation 'com.google.firebase:firebase-database:20.2.2'
    implementation 'com.google.firebase:firebase-auth:22.1.2'
    implementation 'com.google.firebase:firebase-analytics:21.3.0'
    implementation 'com.google.firebase:firebase-storage:20.2.1'
    implementation 'com.google.firebase:firebase-crashlytics:18.4.3'
    implementation 'com.google.firebase:firebase-crashlytics-ndk:18.4.3'

    // Network libraries
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.10.0'

    // Charts for statistics
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation libs.pose.detection.common
    implementation libs.pose.detection.accurate
    implementation libs.object1.detection.common
    implementation libs.segmentation.selfie
    implementation libs.object1.detection.custom
    implementation libs.play.services.mlkit.text.recognition.common
    implementation libs.play.services.mlkit.text.recognition

    // Add or update MLKit Pose Detection and related libraries:
    implementation 'com.google.mlkit:pose-detection:18.0.0-beta4'
    // implementation 'com.google.mlkit:vision-mediapipe:16.2.0'

    // Room Database
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    // Add Room testing support
    testImplementation "androidx.room:room-testing:$room_version"
    // Add Room Guava support for ListenableFuture
    implementation "androidx.room:room-guava:$room_version"

    // Lifecycle components
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.6.2'

    // WorkManager for background tasks
    def work_version = "2.8.1"
    implementation "androidx.work:work-runtime-ktx:$work_version"

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}